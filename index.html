<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketing Team Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Marketing Team Hub — Bags and Gloves.
   Edit the DATA section in the script at the bottom to update the page. */
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#15181d; --muted:#667085; --line:#e4e7ec;
  --brand:#0f766e; --brand-soft:#ccfbf1;
  --todo:#64748b; --doing:#2563eb; --review:#d97706; --done:#16a34a; --late:#dc2626;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115; --card:#181b21; --ink:#eef0f3; --muted:#98a2b3; --line:#2a2f38;
    --brand:#2dd4bf; --brand-soft:#134e4a; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1115; --card:#181b21; --ink:#eef0f3; --muted:#98a2b3; --line:#2a2f38;
  --brand:#2dd4bf; --brand-soft:#134e4a; --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,"Noto Sans Thai",system-ui,sans-serif}
a{color:var(--brand)}
.wrap{max-width:1240px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:12px}
h1{margin:0;font-size:26px;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:13px}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 20px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
nav.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer;font:inherit;font-weight:500}
nav.tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
h2{font-size:18px;margin:28px 0 12px}
h2 .sub{font-weight:400;margin-left:6px}
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}
.stat .n{font-size:26px;font-weight:700;letter-spacing:-.02em}
.stat .l{color:var(--muted);font-size:13px}
.stat .h{font-size:12px;color:var(--muted);margin-top:2px}
.stat.late .n{color:var(--late)}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.warn{background:color-mix(in srgb,var(--review) 12%,transparent);border:1px solid color-mix(in srgb,var(--review) 40%,transparent);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px}
/* workload */
.wl-row{display:grid;grid-template-columns:170px 1fr 90px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.wl-row:last-of-type{border-bottom:0}
.wl-name b{display:block}
.wl-name span{color:var(--muted);font-size:12px}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.wl-num{text-align:right;font-weight:600;font-size:13px}
.wl-num.over{color:var(--late)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* feed */
.feed a{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.feed a:last-child{border-bottom:0}
.feed .who{color:var(--muted);font-size:12px;white-space:nowrap}
/* projects */
.projects{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.pj h3{margin:6px 0 4px;font-size:16px}
.pj .meta{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 12px}
.pj p{font-size:13px;color:var(--muted);margin:8px 0 0}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--brand-soft);color:var(--brand)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;color:#fff}
.prog{height:8px;background:var(--line);border-radius:99px;margin:12px 0 6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--brand)}
.pj .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:transparent;color:var(--ink);padding:7px 12px;border-radius:8px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;display:inline-block}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
/* board */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
select{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:120px}
.col h4{margin:0 0 10px;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}
.task{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--bg)}
.task .t{font-weight:500;font-size:14px}
.task .m{font-size:12px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 10px}
.task .late{color:var(--late);font-weight:600}
.prio-High{border-left:3px solid var(--late)}
.prio-Medium{border-left:3px solid var(--review)}
.prio-Low{border-left:3px solid var(--todo)}
/* calendar */
.cal-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.cal-head h3{margin:0;font-size:18px;min-width:150px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-family:inherit}
.chip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--c)}
.chip.off{opacity:.4}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:11px;color:var(--muted);text-align:center;padding:4px 0;font-weight:600}
.day{background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:104px;padding:4px;cursor:pointer;overflow:hidden}
.day.other{opacity:.35}
.day.today{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.day .num{font-size:12px;font-weight:600;margin-bottom:2px}
.ev{font-size:11px;line-height:1.3;padding:2px 4px;border-radius:4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.more{font-size:11px;color:var(--muted);padding-left:4px}
.daylist .ev{white-space:normal;font-size:13px;padding:8px 10px;margin-bottom:6px}
.daylist .ev small{display:block;color:var(--muted);margin-top:2px}
@media (max-width:700px){ .day{min-height:56px} .day .ev{display:none} .day .cnt{display:block} }
.cnt{display:none;font-size:11px;color:var(--muted)}
/* performance */
.chart{display:flex;align-items:flex-end;gap:8px;height:190px;padding-top:18px;border-bottom:1px solid var(--line)}
.chart .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.chart .b i{display:block;width:100%;max-width:46px;background:var(--brand);border-radius:4px 4px 0 0}
.chart .b i.dim{opacity:.45}
.chart .b span{font-size:11px;color:var(--muted);margin-bottom:3px;white-space:nowrap}
.xl{display:flex;gap:8px}
.xl span{flex:1;text-align:center;font-size:11px;color:var(--muted);padding-top:4px}
.hbar{display:grid;grid-template-columns:minmax(120px,40%) 1fr 64px;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.hbar .track{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--brand)}
.hbar .track i.bad{background:var(--review)}
.hbar b{text-align:right;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:right;padding:7px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px}
.tscroll{overflow-x:auto}
.funnel{display:flex;gap:8px;flex-wrap:wrap}
.funnel div{flex:1;min-width:110px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.funnel b{display:block;font-size:20px}
.funnel span{font-size:12px;color:var(--muted)}
.links a{display:block;padding:8px 0;border-bottom:1px solid var(--line)}
.links a:last-child{border-bottom:0}
/* detail panel */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:10}
.overlay.open{display:block}
.panel{position:absolute;right:0;top:0;bottom:0;width:min(580px,100%);background:var(--card);overflow-y:auto;padding:24px 20px}
.panel h2{margin-top:6px}
.panel dl{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:14px;margin:14px 0}
.panel dt{color:var(--muted)}
.panel dd{margin:0}
.close{float:right}
.hidden{display:none}
footer{margin-top:40px;color:var(--muted);font-size:12px;text-align:center}
@media (max-width:640px){
  .wl-row{grid-template-columns:1fr 80px}
  .wl-row .bar{grid-column:1/-1;order:3}
  h1{font-size:22px}
  .two{grid-template-columns:1fr}
}
</style>

</head>
<body>
<div class="wrap">
  <header>

      <select id="pjChannel"><option value="">All channels</option></select>
    </div>
    <div class="grid projects" id="projects"></div>
  </section>

  <section id="tab-board" class="hidden">
    <div class="filters">
      <select id="fPerson"><option value="">Everyone</option></select>
      <select id="fProject"><option value="">All projects</option></select>
      <select id="fWhen">

      <button class="btn" id="calNext" type="button">›</button>
      <button class="btn" id="calToday" type="button">Today</button>
    </div>
    <div class="chips" id="calChips" style="margin-bottom:12px"></div>
    <div class="cal" id="cal"></div>
    <div class="note">Source: Google Calendar (marketing events only). Click a day to see everything on it.</div>
  </section>

  <section id="tab-performance" class="hidden">
    <div id="perf"></div>
  </section>

  <footer>Add or update tasks in the Google Sheet (＋ Add task) — the page picks them up on reload.</footer>
</div>

<div class="overlay" id="overlay"><div class="panel" id="panel"></div></div>

/* ================= END OF DATA ================= */

let TASKS = [...MANUAL_TASKS, ...GENERATED.tasks];
let SHEET_STATUS = SETTINGS.tasksSheetCsv ? "Loading tasks from Google Sheet…" : "Tasks: built-in list (Google Sheet not connected yet)";
const EVENTS = GENERATED.events;

const COLS = [
  { key: "todo",   label: "To do",       color: "var(--todo)" },
  { key: "doing",  label: "In progress", color: "var(--doing)" },
  { key: "review", label: "Review",      color: "var(--review)" },
  { key: "done",   label: "Done",        color: "var(--done)" }
];
const CATS = {
  line:     { label: "LINE OA",        c: "#16a34a" },
  ads:      { label: "Ads",            c: "#2563eb" },
  ceo:      { label: "CEO / Woon's Lens", c: "#7c3aed" },
  house:    { label: "House Brand",    c: "#0d9488" },
  ecom:     { label: "E-commerce",     c: "#ea580c" },
  content:  { label: "Content",        c: "#4f46e5" },
  review:   { label: "Reviews & reports", c: "#dc2626" },
  team:     { label: "Team & meetings", c: "#475569" },
  deadline: { label: "Design deadline", c: "#db2777" },
  prep:     { label: "Prep",           c: "#94a3b8" }
};
const PJ_COLORS = { "Planning": "var(--todo)", "In progress": "var(--doing)", "On hold": "var(--review)", "Done": "var(--done)" };
const today = new Date(); today.setHours(0,0,0,0);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const person = id => TEAM.find(p => p.id === id) || { name: id || "Unassigned", role: "" };
const project = id => PROJECTS.find(p => p.id === id) || { name: id };
const d = s => { if (!s) return null; const x = new Date(s + "T00:00:00"); return isNaN(x) ? null : x; };
const iso = x => `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`;
const fmt = s => { const x = d(s); return x ? x.toLocaleDateString("en-GB", { day: "numeric", month: "short" }) : "—"; };
const baht = n => "฿" + Math.round(n).toLocaleString("en-US");
const num = n => Math.round(n).toLocaleString("en-US");
const isLate = t => t.status !== "done" && d(t.due) && d(t.due) < today;
const tasksOf = pid => TASKS.filter(t => t.project === pid);
const progress = pid => { const ts = tasksOf(pid); return ts.length ? Math.round(ts.filter(t => t.status === "done").length / ts.length * 100) : 0; };
const inDays = n => { const x = new Date(today); x.setDate(x.getDate() + n); return x; };

function taskCard(t, showProject = true){
  return `<div class="task prio-${esc(t.priority)}">
    <div class="t">${esc(t.title)}</div>
    <div class="m">
      ${showProject ? `<a href="#p/${esc(t.project)}">${esc(project(t.project).name)}</a>` : ""}
      <span>👤 ${esc(person(t.assignee).name)}</span>
      <span class="${isLate(t) ? "late" : ""}">📅 ${t.publish ? "Design due " : "Due "}${fmt(t.due)}${isLate(t) ? " · overdue" : ""}</span>
      ${t.publish ? `<span>🚀 Publish ${fmt(t.publish)}</span>` : ""}
      ${t.src ? `<span>${esc(t.src)}</span>` : ""}
    </div></div>`;
}

/* ---------- Overview ---------- */
function renderOverview(){
  const open = TASKS.filter(t => t.status !== "done");
  const stats = [
    ["Active projects", PROJECTS.filter(p => p.status !== "Done").length],
    ["Open tasks", open.length, "", "20 Sep – 31 Oct"],
    ["Overdue", open.filter(isLate).length, "late", "past due date, not marked done"],
    ["Events in next 7 days", EVENTS.filter(e => d(e.d) >= today && d(e.d) <= inDays(7)).length],
    ["Aug Shopee sales", baht(PERF.shopeeMonthly.at(-1).sales), "", "confirmed, best month so far"],
    ["Sep leads", PERF.leads.total, "", `${PERF.leads.gradeB} graded B · ${PERF.leads.quotes} quotes`]
  ];
  $("#stats").innerHTML = stats.map(([l, n, c, h]) =>
    `<div class="card stat ${c || ""}"><div class="n">${n}</div><div class="l">${l}</div>${h ? `<div class="h">${h}</div>` : ""}</div>`).join("");

  const counts = TEAM.map(p => TASKS.filter(t => t.assignee === p.id && t.status !== "done").length);
  const max = Math.max(SETTINGS.maxOpenTasks, ...counts);
  $("#workload").innerHTML = TEAM.map(p => {
    const mine = TASKS.filter(t => t.assignee === p.id);
    const openN = mine.filter(t => t.status !== "done").length;
    const lateN = mine.filter(isLate).length;
    const segs = COLS.filter(c => c.key !== "done").map(c => {
      const n = mine.filter(t => t.status === c.key).length;
      return n ? `<i style="width:${n / max * 100}%;background:${c.color}" title="${c.label}: ${n}"></i>` : "";
    }).join("");
    const over = openN > SETTINGS.maxOpenTasks;
    return `<div class="wl-row">
      <div class="wl-name"><b>${esc(p.name)}</b><span>${esc(p.role)}</span></div>
      <div class="bar">${segs}</div>
      <div class="wl-num ${over ? "over" : ""}">${openN} open${over ? " ⚠" : ""}<br><span class="sub">${lateN} overdue</span></div></div>`;
  }).join("") + `<div class="legend">${COLS.filter(c => c.key !== "done").map(c => `<span><i style="background:${c.color}"></i>${c.label}</span>`).join("")}<span>⚠ = over ${SETTINGS.maxOpenTasks} open tasks</span></div>`;

  $("#feed").innerHTML = FEED.map(f => `<a href="${esc(f.url)}" target="_blank" rel="noopener"><span>${esc(f.title)}</span><span class="who">${esc(f.who)} · ${fmt(f.d)}</span></a>`).join("");

  const soon = TASKS.filter(t => t.status !== "done" && d(t.due) && d(t.due) >= today && d(t.due) <= inDays(7))
                    .sort((a, b) => d(a.due) - d(b.due));
  const shown = soon.slice(0, 10);
  $("#upcoming").innerHTML = shown.length
    ? shown.map(t => taskCard(t)).join("") + (soon.length > shown.length ? `<div class="note">+ ${soon.length - shown.length} more on the Task board.</div>` : "")
    : `<div class="sub">Nothing due in the next 7 days.</div>`;
}

/* ---------- Projects ---------- */
function renderProjects(){
  const st = $("#pjStatus").value, ch = $("#pjChannel").value;
  const list = PROJECTS.filter(p => (!st || p.status === st) && (!ch || p.channel === ch));
  $("#projects").innerHTML = list.map(p => {
    const ts = tasksOf(p.id), pr = progress(p.id);
    const late = ts.filter(isLate).length;
    return `<div class="card pj">
      <span class="tag">${esc(p.channel)}</span>
      <span class="pill" style="background:${PJ_COLORS[p.status] || "var(--todo)"}">${esc(p.status)}</span>
      <h3>${esc(p.name)}</h3>
      <div class="meta"><span>👤 ${esc(person(p.owner).name)}</span>${p.due ? `<span>📅 Due ${fmt(p.due)}</span>` : ""}${late ? `<span style="color:var(--late);font-weight:600">${late} overdue</span>` : ""}</div>
      <p>${esc(p.goal)}</p>
      <div class="prog"><i style="width:${pr}%"></i></div>
      <div class="row"><span>${ts.filter(t => t.status === "done").length}/${ts.length} tasks done</span><span>${pr}%</span></div>
      <div class="btns">
        <a class="btn primary" href="#p/${esc(p.id)}">View details</a>
        ${p.briefUrl ? `<a class="btn" href="${esc(p.briefUrl)}" target="_blank" rel="noopener">Open brief ↗</a>` : ""}
      </div></div>`;
  }).join("") || `<div class="sub">No projects match.</div>`;
}

/* ---------- Board ---------- */
function renderBoard(){
  const who = $("#fPerson").value, pj = $("#fProject").value, when = $("#fWhen").value;
  const list = TASKS.filter(t => (!who || t.assignee === who) && (!pj || t.project === pj)
    && (when !== "late" || isLate(t))
    && (when !== "week" || (t.status !== "done" && d(t.due) && d(t.due) >= today && d(t.due) <= inDays(7))));
  $("#board").innerHTML = COLS.map(c => {
    const ts = list.filter(t => t.status === c.key).sort((a, b) => (d(a.due) || 0) - (d(b.due) || 0));
    return `<div class="col"><h4><span><span class="dot" style="background:${c.color}"></span>${c.label}</span><span class="sub">${ts.length}</span></h4>
      ${ts.map(t => taskCard(t)).join("") || `<div class="sub">—</div>`}</div>`;
  }).join("");
  $("#boardNote").textContent = "Designer tasks come from the Designer Automation sheet. Many September items still show 'Briefed' there, so some may already be published — update the sheet status to clear them from 'overdue'.";
}

/* ---------- Calendar ---------- */
let calMonth = new Date(today.getFullYear(), today.getMonth(), 1);
const calOff = new Set();
function eventsOn(ds){
  return EVENTS.filter(e => !calOff.has(e.cat) && (e.d === ds || (e.end && e.d <= ds && ds <= e.end)))
    .sort((a, b) => (a.t || "00:00").localeCompare(b.t || "00:00"));
}
function evHtml(e, full){
  const c = (CATS[e.cat] || CATS.content).c;
  const range = e.end ? ` (${fmt(e.d)} → ${fmt(e.end)})` : "";
  return `<div class="ev" style="--c:${c}" title="${esc(e.title)}">${e.t ? `<b>${e.t}</b> ` : ""}${esc(e.title)}${full ? `<small>${esc((CATS[e.cat] || {}).label || "")}${range}${e.who ? " · " + esc(e.who.join(", ")) : ""}</small>` : ""}</div>`;
}
function renderCalendar(){
  $("#calChips").innerHTML = Object.entries(CATS).map(([k, v]) =>
    `<button class="chip ${calOff.has(k) ? "off" : ""}" data-cat="${k}" style="--c:${v.c}"><i></i>${v.label}</button>`).join("");

  const first = new Date(calMonth); const startDow = (first.getDay() + 6) % 7; // Monday first
  const start = new Date(first); start.setDate(1 - startDow);
  let html = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(x => `<div class="dow">${x}</div>`).join("");
  for (let i = 0; i < 42; i++){
    const day = new Date(start); day.setDate(start.getDate() + i);
    if (i >= 35 && day.getMonth() !== calMonth.getMonth()) break;
    const ds = iso(day), evs = eventsOn(ds);
    html += `<div class="day ${day.getMonth() !== calMonth.getMonth() ? "other" : ""} ${+day === +today ? "today" : ""}" data-day="${ds}">

  }
  $("#cal").innerHTML = html;
}

/* ---------- Google Sheet task loader ---------- */
function parseCSV(text){
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){
      if (ch === '"'){ if (text[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += ch;
    } else if (ch === '"') q = true;
    else if (ch === ","){ row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r"){
      if (ch === "\r" && text[i+1] === "\n") i++;
      row.push(cell); rows.push(row); row = []; cell = "";
    } else cell += ch;
  }
  if (cell !== "" || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ""));
}
const norm = s => String(s || "").trim().toLowerCase();
function matchPerson(v){
  const n = norm(v); if (!n) return "";
  const p = TEAM.find(t => norm(t.id) === n || norm(t.name) === n || (t.aliases || []).some(a => norm(a) === n));
  return p ? p.id : String(v).trim();
}
function matchProject(v){
  const n = norm(v); if (!n) return "other";
  const p = PROJECTS.find(x => norm(x.id) === n || norm(x.name) === n);
  return p ? p.id : String(v).trim();
}
function matchStatus(v){
  const n = norm(v).replace(/\s+/g, " ");
  if (["in progress", "doing", "working", "กำลังทำ"].includes(n)) return "doing";
  if (["review", "in review", "waiting approval", "รออนุมัติ"].includes(n)) return "review";
  if (["done", "complete", "completed", "published", "เสร็จ"].includes(n)) return "done";
  return "todo";
}
function parseDate(v){
  v = String(v || "").trim(); if (!v) return "";
  let m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  let y, mo, da;
  if (m){ [, y, mo, da] = m; }
  else if ((m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/))){ [, da, mo, y] = m; } // day/month/year
  else return "";
  y = +y; if (y > 2400) y -= 543; // Thai Buddhist year
  return `${y}-${String(mo).padStart(2, "0")}-${String(da).padStart(2, "0")}`;
}
function rowsToTasks(rows){
  const h = rows[0].map(norm);
  const col = key => h.findIndex(x => x.startsWith(key));
  const c = { project: col("project"), title: col("task"), assignee: col("assignee"), status: col("status"),
              due: col("due"), priority: col("priority"), notes: col("notes") };
  return rows.slice(1).map(r => ({
    project: matchProject(r[c.project]),
    title: (r[c.title] || "").trim(),
    assignee: matchPerson(r[c.assignee]),
    status: matchStatus(r[c.status]),
    due: parseDate(r[c.due]),
    priority: ["High", "Medium", "Low"].find(p => norm(p) === norm(r[c.priority])) || "Medium",
    src: (c.notes >= 0 && r[c.notes]) ? r[c.notes].trim() : "Task sheet"
  })).filter(t => t.title);
}
async function loadSheetTasks(){
  const url = SETTINGS.tasksSheetCsv;
  if (!url) return;
  try {
    const res = await fetch(url + (url.includes("?") ? "&" : "?") + "cb=" + Date.now());
    if (!res.ok) throw new Error("HTTP " + res.status);
    const tasks = rowsToTasks(parseCSV(await res.text()));
    TASKS = [...tasks, ...GENERATED.tasks];
    SHEET_STATUS = `Tasks: ${tasks.length} from Google Sheet (loaded ${new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })})`;
  } catch (e) {
    SHEET_STATUS = "Couldn't load the Google Sheet — showing the built-in task list";
    console.warn("Task sheet load failed:", e);
  }
  renderAll();
}
function renderAll(){
  $("#subline").textContent = `Last updated ${fmt(SETTINGS.lastUpdated)} · ${PROJECTS.length} projects · ${TASKS.length} tasks · ${EVENTS.length} calendar events · ${SHEET_STATUS}`;
  renderOverview(); renderProjects(); renderBoard(); renderCalendar(); renderPerf();
  if (location.hash) route();
}

function fillSelect(sel, items){ sel.insertAdjacentHTML("beforeend", items.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join("")); }

function init(){
  document.title = SETTINGS.teamName;
  $("#teamName").textContent = SETTINGS.teamName;
  const add = $("#addTaskBtn");
  if (SETTINGS.tasksSheetEdit) add.href = SETTINGS.tasksSheetEdit; else add.remove();
  fillSelect($("#pjStatus"), [...new Set(PROJECTS.map(p => p.status))].map(s => [s, s]));
  fillSelect($("#pjChannel"), [...new Set(PROJECTS.map(p => p.channel))].map(s => [s, s]));
  fillSelect($("#fPerson"), TEAM.map(p => [p.id, p.name]));
  fillSelect($("#fProject"), PROJECTS.map(p => [p.id, p.name]));
  ["#pjStatus", "#pjChannel"].forEach(s => $(s).addEventListener("change", renderProjects));
  ["#fPerson", "#fProject", "#fWhen"].forEach(s => $(s).addEventListener("change", renderBoard));

  $("#tabs").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
    ["overview", "projects", "board", "calendar", "performance"].forEach(t => $("#tab-" + t).classList.toggle("hidden", t !== b.dataset.tab));
  });
  $("#calPrev").onclick = () => { calMonth.setMonth(calMonth.getMonth() - 1); renderCalendar(); };
  $("#calNext").onclick = () => { calMonth.setMonth(calMonth.getMonth() + 1); renderCalendar(); };
  $("#calToday").onclick = () => { calMonth = new Date(today.getFullYear(), today.getMonth(), 1); renderCalendar(); };
  $("#calChips").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    calOff.has(b.dataset.cat) ? calOff.delete(b.dataset.cat) : calOff.add(b.dataset.cat);
    renderCalendar();
  });
  $("#cal").addEventListener("click", e => { const x = e.target.closest(".day"); if (x) openDay(x.dataset.day); });

  $("#overlay").addEventListener("click", e => { if (e.target.id === "overlay") closePanel(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closePanel(); });
  $("#themeBtn").addEventListener("click", () => {
    const r = document.documentElement;
    const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    r.dataset.theme = dark ? "light" : "dark";
  });
  window.addEventListener("hashchange", route);

  renderAll(); route();
  loadSheetTasks();
}
init();
</script>
